[platformio]
default_envs = linux_aarch64_cuda
boards_dir = ll_pio/boards

[common]
build_type = release
board_build.variants_dir = ll_pio/variants
board_build.variant = ll_variant-generic
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3

; ESP32-S3 DevKit-C: 8MB flash, 2MB PSRAM. CHIP-DETECTED 2026-08-22 (esptool flash_id on MAC dc:da:0c:61:9f:0c: 'Detected flash size: 8MB', device c8:4017, 'Embedded PSRAM 2MB'). Previously declared N4R8/flash_mb=4, which selected partitions_4M.csv and capped app0 at 1.47MB -- 99.3% full -- while ~4MB of the chip stayed unpartitioned. nxry and the chip flag were corrected to N8R2 to match (2026-08-22): the old -DLL_ESP32_N4R8 was not even a declared flag -- ll_platform_generic.h declares LL_ESP32_N4R4 and LL_ESP32S3_N8R2, never LL_ESP32_N4R8 -- and neither flag is read anywhere in the tree, so this is metadata only, no behaviour change.
[env:linux_aarch64_cuda]
extends = common
platform = file://./ll_pio/platforms/linux_aarch64
board = jetson_orin_nano
build_flags =
    -DLL_BOARD_NAME='"linux_aarch64_cuda"'
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3
    -DLL_POSIX=1
    -DLL_FAKE_ARDUINO=1
    -DLL_COMPLEX=1
    -DLL_RATIONAL=1
    -DLL_BIGNUM=1
    -march=armv8.2-a
    -flto=auto
    -D_POSIX_C_SOURCE=200809L
    -Wl,--wrap=fmod
    -Wl,--wrap=strtol
    -Wl,--wrap=__isoc23_strtol
    -Wl,--undefined=__wrap_fmod
    -Wl,--undefined=__wrap_strtol
    -Wl,--undefined=__wrap___isoc23_strtol
    -DLL_CUDA=1
    -lcudart
    -DLL_MODBUS=1
    -DLL_ARM64=1
    -DLL_AARCH64=1
    -L$PROJECT_DIR
    -llamblisp

; ESP32-S3 N8R2 unit 00 (YD-ESP32-23 2022-v1.3, MAC 28:37:2f:f8:b1:44): 8MB flash, 2MB PSRAM.  IDENTICAL build to esp32s3-n8r2 -- the separate env exists only to bind results and flashes to ONE PHYSICAL BOARD, because two units share the same CH343 VID:PID and --port-for would otherwise pick whichever enumerated first.  NOT DELIVERABLE: this is a per-UNIT test env, not a customer product -- the shipped package stays esp32s3-n8r2.  Without deliverable:false a wildcard release_any/publish_any would create and FORCE-PUSH a public repo per physical board.  [NOT DELIVERABLE -- dev/debug build, not shipped]